services:
  # ==========================================
  # Backend Go: API REST, Liveness y SSE Hub
  # ==========================================
  - type: web
    name: mias-backend
    runtime: go
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: go build -o server ./cmd/api && go build -o migrate ./cmd/migrate
    startCommand: ./migrate && ./server
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mias-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: "*"
      - key: GOOGLE_CLIENT_ID
        value: 98403624230-bt0rlk0cshti1deo9b02egref3g4tjs4.apps.googleusercontent.com

  # ==========================================
  # Frontend Svelte 5 / Vite (Sitio Estático)
  # ==========================================
  - type: web
    name: mias-frontend
    runtime: static
    rootDir: frontend
    buildCommand: pnpm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: mias-backend
          property: host
      - key: VITE_GOOGLE_CLIENT_ID
        value: 98403624230-bt0rlk0cshti1deo9b02egref3g4tjs4.apps.googleusercontent.com

databases:
  # ==========================================
  # Base de Datos PostgreSQL Administrada
  # ==========================================
  - name: mias-db
    plan: free
    region: oregon
    databaseName: mias_db
    user: mias_user
