version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations/00001_init.sql"
    queries: "sql/queries/"
    gen:
      go:
        package: "db"
        out: "internal/database/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: true
        emit_interface: true
        emit_exact_table_names: false
