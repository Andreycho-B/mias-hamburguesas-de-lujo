# ─────────────────────────────────────────────────────────────
# Mías Hamburguesas de Lujo — Nginx SPA Configuration
# Compresión GZIP, cacheo inmutable de assets, ruteo SPA
# ─────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Compresión GZIP ──────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/woff2;

    # ── Cabeceras de Seguridad ───────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Assets inmutables (JS/CSS con hash de Vite) ──────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Imágenes y recursos estáticos ────────────────────────
    location /imagenes/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ── Service Worker: sin cacheo ───────────────────────────
    location = /sw.js {
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # ── PWA Manifest: recarga frecuente ──────────────────────
    location = /manifest.webmanifest {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ── SPA Fallback: cualquier ruta desconocida → index.html ─
    location / {
        try_files $uri $uri/ /index.html;
    }
}
