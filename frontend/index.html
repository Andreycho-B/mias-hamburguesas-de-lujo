<!doctype html>
<html lang="es" style="background-color: #050507; color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/imagenes/marca/isotipo.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#050507" />
    <meta name="description" content="Mías Hamburguesas de Lujo. Lo Íntimo Hecho para Compartir. Hamburguesas artesanales al carbón y programa de fidelización." />
    
    <title>Mías Hamburguesas de Lujo | Lo Íntimo Hecho para Compartir</title>

    <!-- Prevención inmediata de parpadeo blanco (FOUC): aplica fondo negro obsidiana antes de cualquier recurso -->
    <style>
      html, body {
        background-color: #050507 !important;
        color: #EDE8DC;
        color-scheme: dark;
        margin: 0;
        padding: 0;
      }
      #app {
        background-color: #050507;
        min-height: 100vh;
      }
    </style>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Typography: Fontshare (Satoshi, Cabinet Grotesk) & Google Fonts (Playfair Display, Cormorant Garamond, Italianno, JetBrains Mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Italiana&family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:ital,wght@1,500;1,600;1,700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Italianno&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&display=swap" rel="stylesheet" />
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&f[]=cabinet-grotesk@400,500,700,800&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-char text-bone font-sans antialiased selection:bg-ember selection:text-white min-h-screen" style="background-color: #050507; color-scheme: dark; touch-action: pan-y; overscroll-behavior-y: none;">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
