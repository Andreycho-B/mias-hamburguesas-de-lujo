<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/imagenes/marca/isotipo.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0C0C0E" id="theme-color-meta" />
    <meta name="description" content="Mías Hamburguesas de Lujo. Lo Íntimo Hecho para Compartir. Hamburguesas artesanales al carbón y programa de fidelización." />
    
    <!-- iOS Safari PWA Standalone Configuration -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" id="apple-status-bar-meta" />
    <meta name="apple-mobile-web-app-title" content="Mías" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <title>Mías Hamburguesas de Lujo | Lo Íntimo Hecho para Compartir</title>

    <!-- Detección síncrona instantánea antes del primer renderizado: previene el parpadeo de color -->
    <script>
      (function() {
        try {
          var key = 'mias_intro_seen_at';
          var saved = localStorage.getItem(key);
          var isIntroDone = false;
          if (saved) {
            var time = parseInt(saved, 10);
            if (!isNaN(time) && (Date.now() - time) < 3600000) {
              isIntroDone = true;
            }
          }
          var root = document.documentElement;
          var metaTheme = document.getElementById('theme-color-meta');
          var metaApple = document.getElementById('apple-status-bar-meta');
          if (isIntroDone) {
            root.classList.add('theme-home');
            root.style.backgroundColor = '#0C0C0E';
            root.style.colorScheme = 'dark';
            if (metaTheme) metaTheme.setAttribute('content', '#0C0C0E');
            if (metaApple) metaApple.setAttribute('content', 'black-translucent');
          } else {
            root.classList.add('theme-intro');
            root.style.backgroundColor = '#050507';
            root.style.colorScheme = 'dark';
            if (metaTheme) metaTheme.setAttribute('content', '#050507');
            if (metaApple) metaApple.setAttribute('content', 'black-translucent');
          }
        } catch (e) {
          document.documentElement.classList.add('theme-intro');
          document.documentElement.style.backgroundColor = '#050507';
        }
      })();
    </script>

    <!-- Estilos inmediatos anti-parpadeo sincronizados por clase de tema -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
      }
      html.theme-intro, 
      html.theme-intro body, 
      html.theme-intro #app {
        background-color: #050507 !important;
        color: #EDE8DC;
        color-scheme: dark;
      }
      html.theme-home, 
      html.theme-home body, 
      html.theme-home #app {
        background-color: #0C0C0E !important;
        color: #EDE8DC;
        color-scheme: dark;
      }
      #app {
        min-height: 100vh;
      }
    </style>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Tipografía Asíncrona (Non-blocking): Fontshare & Google Fonts sin demoras de renderizado -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />

    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Italiana&family=Italianno&family=JetBrains+Mono:wght@400;500;600&family=Pinyon+Script&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Italiana&family=Italianno&family=JetBrains+Mono:wght@400;500;600&family=Pinyon+Script&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" media="print" onload="this.media='all'" />

  </head>
