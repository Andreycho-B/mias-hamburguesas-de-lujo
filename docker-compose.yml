services:
  postgres:
    image: postgres:16-alpine
    container_name: mias_postgres_16
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mias_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mias_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    name: mias_postgres_16_data
