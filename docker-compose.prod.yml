# ─────────────────────────────────────────────────────────────
# Mías Hamburguesas de Lujo — Docker Compose de Producción
# Orquesta: PostgreSQL 16 + Backend Go + Frontend Nginx
# ─────────────────────────────────────────────────────────────

services:
  # ── Base de Datos ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: mias_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mias_db}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mias_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - mias_internal

  # ── Backend Go API ─────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mias_api_prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8080"
      ENV_MODE: "production"
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-mias_db}?sslmode=disable"
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-https://miashamburguesas.com}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-https://miashamburguesas.com}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-100}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "${API_PORT:-8080}:8080"
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - mias_internal

  # ── Frontend Nginx (Assets Estáticos) ──────────────────────
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.miashamburguesas.com/api/v1}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    container_name: mias_web_prod
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - mias_internal

volumes:
  pgdata_prod:
    name: mias_postgres_prod_data

networks:
  mias_internal:
    driver: bridge
